  dashboard: # NEW SERVICE FOR DASH
    build:
      context: . # Can use the same context if Dash deps are in main requirements.txt
      dockerfile: Dockerfile.dashboard # OR use a separate Dockerfile for Dash if deps differ
    container_name: trading_platform_dashboard
    volumes: # Needs access to the artifacts and its own code
      - ./web_dashboard:/opt/app/web_dashboard # Mount Dash app code
      - ./data:/opt/app/data                 # Access to backtest results
      - ./configs:/opt/app/configs           # If Dash AppConfig needs it
    ports:
      - "8050:8050" # Expose Dash app on host port 8050
    environment:
      - PYTHONUNBUFFERED=1
      # If Dash AppConfig needs DB/API keys (e.g., to show live account status), pass them
      # - DB_HOST_ENV_VAR=${DB_HOST_ENV_VAR:-db} # etc.
      # Could also set a specific profile for Dash AppConfig
      # - APP_CONFIG_PROFILE=dashboard_profile 
    # depends_on: # Only if it needs db for its own operations directly
    #   - db 
    command: ["python", "web_dashboard/app.py"] # Command to start Dash server