# trading_platform/docker-compose.yml

x-app-image-name: &app-image "niejemglutenu/trading_platform_app:latest"


x-cli-app-base: &cli-app-base
  env_file: .env
  build:
    context: .
    dockerfile: Dockerfile # Assumes your primary app Dockerfile is named Dockerfile

  volumes:
    - ./app:/opt/app/app   # Mounts local app to /opt/app/app in container
    - ./configs:/opt/app/configs # Mounts local configs to /opt/app/configs
    - ./data:/opt/app/data 
    - ./logs:/opt/app/logs     # For logs on host
  environment:
  - PYTHONUNBUFFERED=1
  - DB_HOST=host.docker.internal         # ✅ Correct name
  - DB_NAME=${DB_NAME_ENV_VAR}
  - DB_USER=${DB_USER_ENV_VAR}
  - DB_PASSWORD=${DB_PASSWORD_ENV_VAR}
  - ALPACA_API_KEY=${ALPACA_API_KEY_ENV_VAR}
  - ALPACA_API_SECRET=${ALPACA_API_SECRET_ENV_VAR}
  - ALPACA_SANDBOX_MODE=${ALPACA_SANDBOX_MODE_ENV_VAR}
  
  develop: # NEW SECTION
    watch:
      - action: sync # Sync Python code changes
        path: ./app # Local path to watch
        target: /opt/app/app # Target path inside the container
        ignore: # Optional: patterns to ignore
          - __pycache__/
          - .git/
          - .venv/ # If your venv is inside ./app (unlikely for project root)
      - action: rebuild # Rebuild if requirements change
        path: requirements.txt
      # You could also watch Dockerfile itself for rebuild, though changing it usually means manual rebuild anyway
      # - action: rebuild
      #   path: Dockerfile

  


services:
  backtest-runner:
    <<: *cli-app-base # Inherit common CLI app settings
    container_name: trading_platform_backtester
    # No 'image:' line here for typical local development.
    # Docker Compose will build an image named e.g., 'trading_platform_backtest-runner'.
    command: > # Default command if 'docker-compose up backtest-runner' is used
      python -m app.cli
      --mount 
      --mode "backtest" 
      --base-config "app_config.yaml"
      --profile-config "app_config.yaml" 
    volumes:
      - ./app:/opt/app/app

    restart: "no"
    

  
  live-scheduler: # For batch live predictions
    <<: *cli-app-base
    container_name: trading_platform_live_scheduler
    command: >
      python -m app.cli 
      --mode "live_predict" 
      --base-config "app_config.yaml"
      --profile-config "app_config.yaml"
      --force-retrain-models # Often true for daily live runs
      --log-level "INFO"
    # restart: unless-stopped # Consider if this service is managed by an external scheduler


